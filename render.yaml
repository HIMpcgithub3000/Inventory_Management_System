# Render Blueprint — deploys the IOMS backend + a managed Postgres database.
# Docs: https://render.com/docs/blueprint-spec
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
databases:
  - name: ioms-db
    plan: free            # 90-day free Postgres; bump to "basic" / "standard" for production
    databaseName: ioms
    user: ioms

services:
  - type: web
    name: ioms-backend
    runtime: docker
    plan: free            # free web service (spins down after ~15 min idle; first hit is slow)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Wired automatically from the database above (Render injects the connection string;
      # config.py normalizes it to the postgresql+psycopg:// driver).
      - key: DATABASE_URL
        fromDatabase:
          name: ioms-db
          property: connectionString
      # Comma-separated exact origins (local dev + any fixed prod URLs).
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      # Regex matching ALL Vercel URLs for this project (production + every preview
      # deploy, which each get a new subdomain). This is why CORS keeps working
      # across redeploys without touching anything.
      - key: CORS_ORIGIN_REGEX
        value: 'https://inventory-management-system.*\.vercel\.app'
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOW_STOCK_THRESHOLD
        value: "10"
