# Render Blueprint — deploys the IOMS stack: frontend + backend + Postgres.
# Docs: https://render.com/docs/blueprint-spec
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
databases:
  - name: ioms-db
    plan: free            # 90-day free Postgres; bump to "basic" / "standard" for production
    databaseName: ioms
    user: ioms

services:
  # ---- Backend API (FastAPI, Docker) -------------------------------------
  - type: web
    name: ioms-backend
    runtime: docker
    plan: free            # free web service (spins down after ~15 min idle; first hit is slow)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Wired automatically from the database below (Render injects the connection
      # string; config.py normalizes it to the postgresql+psycopg:// driver).
      - key: DATABASE_URL
        fromDatabase:
          name: ioms-db
          property: connectionString
      # Exact allowed origins for local dev.
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      # Regex allowing the Render-hosted frontend AND any Vercel URL for this project.
      # Covers every preview/prod subdomain, so CORS never breaks across redeploys.
      - key: CORS_ORIGIN_REGEX
        value: 'https://(ioms-frontend.*\.onrender\.com|inventory-management-system.*\.vercel\.app)'
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOW_STOCK_THRESHOLD
        value: "10"

  # ---- Frontend (React + Vite, static site — free, never sleeps) ---------
  - type: web
    name: ioms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Build-time API base URL. MUST match the backend's live URL below.
      # If the backend deploys under a different name/suffix, update this and redeploy.
      - key: VITE_API_URL
        value: https://ioms-backend.onrender.com
    routes:
      # SPA fallback so client-side routes (e.g. /dashboard) don't 404 on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
