name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ioms
          POSTGRES_PASSWORD: ioms
          POSTGRES_DB: ioms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ioms -d ioms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ioms:ioms@localhost:5432/ioms_test
        run: pytest -q

  docker-build-and-push:
    needs: backend-tests
    runs-on: ubuntu-latest
    env:
      # Surfaced so step `if:` can gate on presence (secrets aren't allowed in `if`).
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Always build both images to validate the Dockerfiles.
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ioms-backend:ci

      # Security scan (block on CRITICAL). Non-fatal if Trivy DB is unavailable.
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ioms-backend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Push to Docker Hub on main (requires DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets).
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ioms-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ioms-backend:${{ github.sha }}
